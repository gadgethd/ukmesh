# Shared PostgreSQL resource policy. Consumers extend this service under their
# existing DB name; do not merge this file as an additional deployed service.
# Credentials, data volumes, ports and health bindings belong to the deployment.
services:
  postgres:
    image: timescale/timescaledb@sha256:22e8a5ae7aef121d1537afe946dd7cc5deeeb63ab36ce19849d671bd3b663509
    # Retain connection reserve and diagnostics independently of image autotuning.
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_connections=100
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM:-32MB}
      # Planner costs describe the whole-stack cache; they allocate no memory.
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-4}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
    cpus: 2
    mem_limit: &postgres-memory 2g
    memswap_limit: *postgres-memory
    shm_size: "1g"
