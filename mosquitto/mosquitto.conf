# MeshCore Analytics - Mosquitto configuration
# WebSockets only — all traffic routes through Cloudflare Tunnel

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

# Public/ingest WebSocket listener.
listener 9001
protocol websockets

# Internal-only TCP listener used by the Prometheus exporter. Compose does not
# publish this port on the host, and the normal password/ACL policy still
# applies.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Connection limits
max_connections 500
max_keepalive 300
