version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ['*']
        exclude-patterns:
          - 'maplibre-gl'
          - '@maplibre/*'
    ignore:
      # maplibre-gl is version-locked on purpose: frontend/src/plugins/maplibre-source.ts
      # rebuilds MapLibre from its own source maps and refuses to build for any other
      # version until that source/worker inventory is re-qualified (#239).
      - dependency-name: 'maplibre-gl'
      - dependency-name: '@maplibre/*'
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      scripts-dependencies:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /viewshed-worker
    schedule:
      interval: weekly
    groups:
      rf-worker-dependencies:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /viewshed-worker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
