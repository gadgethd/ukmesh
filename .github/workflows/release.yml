name: Signed container release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate vulnerability waivers
        run: node scripts/check-trivy-waivers.mjs
      - name: Require a clean commit release
        run: test -z "$(git status --porcelain --untracked-files=all)"

  image:
    name: ${{ matrix.component }}
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: meshcore-backend
            context: .
            file: Dockerfile.backend
            build_args: ''
          - component: combined
            image: meshcore-combined
            context: .
            file: Dockerfile
            build_args: VITE_APP_HOSTNAME=app.ukmesh.com
          - component: app
            image: meshcore-app
            context: .
            file: Dockerfile.app
            build_args: |
              VITE_APP_HOSTNAME=app.ukmesh.com
              VITE_NETWORK=ukmesh
              VITE_SITE=ukmesh
              VITE_RF_COVERAGE_ENABLED=true
          - component: website
            image: meshcore-website
            context: .
            file: Dockerfile.website
            build_args: |
              VITE_APP_HOSTNAME=app.ukmesh.com
              VITE_SITE=ukmesh
          - component: rf-worker
            image: meshcore-rf-worker
            context: viewshed-worker
            file: viewshed-worker/Dockerfile
            build_args: ''
          - component: hopreach
            image: meshcore-hopreach
            context: third_party/hopreach
            file: third_party/hopreach/Dockerfile
            source_revision: 0230702be70a2729c5acc5640401f56ab9d65fd4
            build_args: VERSION=v0.1.32-ukmesh.3
          - component: mosquitto-reloader
            image: meshcore-mosquitto-reloader
            context: .
            file: Dockerfile.mosquitto-reloader
            build_args: ''
          - component: health-check
            image: meshcore-health-check
            context: .
            file: Dockerfile.mesh-health-check
            build_args: MESH_HEALTH_CHECK_REF=952eec8e0c55d0749f9abef211c266f992c0bfc7
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
      SOURCE_REVISION: ${{ matrix.source_revision || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - id: build
        name: Build and push immutable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ env.SOURCE_REVISION }}
            ${{ matrix.build_args }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Gate exact digest on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-${{ matrix.component }}.json
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Generate SPDX SBOM for exact digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
      # Keyless signing is deliberately not part of this job: it lives in the
      # `sign` job below, which is restricted to version tags and gated by the
      # protected `release-signing` environment. Branch dispatches still build,
      # scan, and publish images; they simply cannot produce a release signature.
      - id: provenance
        name: Publish registry provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Write release inventory
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          jq -n \
            --arg component "${{ matrix.component }}" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg release_revision "$GITHUB_SHA" \
            --arg image "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --arg sbom "sbom-${{ matrix.component }}.spdx.json" \
            --arg scan "trivy-${{ matrix.component }}.json" \
            --arg signature "signature-${{ matrix.component }}.json" \
            --arg provenance "$ATTESTATION_URL" \
            '{
              format: "meshcore-release-inventory-v1",
              component: $component,
              source_revision: $source_revision,
              release_revision: $release_revision,
              image: $image,
              sbom: $sbom,
              scan: $scan,
              signature: $signature,
              provenance: $provenance
            }' > "inventory-${{ matrix.component }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.sha }}-${{ matrix.component }}
          if-no-files-found: error
          retention-days: 90
          path: |
            inventory-${{ matrix.component }}.json
            sbom-${{ matrix.component }}.spdx.json
            trivy-${{ matrix.component }}.json

  sign:
    name: Sign ${{ matrix.component }}
    needs: image
    # Only a version tag may produce a release signature. `workflow_dispatch`
    # is unqualified, so this guard is the control that keeps a branch run from
    # minting a signature that verifies against a release identity.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required reviewers are configured on this environment in repository
    # settings: the job blocks until an approver releases it. The environment
    # also scopes any secrets used for signing to tagged releases only.
    environment:
      name: release-signing
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
          - component: combined
          - component: app
          - component: website
          - component: rf-worker
          - component: hopreach
          - component: mosquitto-reloader
          - component: health-check
    steps:
      - name: Download the image job's release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}-${{ matrix.component }}
          path: evidence
      - name: Require the inventory to name an immutable digest
        id: image
        run: |
          set -euo pipefail
          image="$(jq -r '.image' "evidence/inventory-${{ matrix.component }}.json")"
          if ! [[ "$image" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "release inventory does not name an immutable image digest: $image" >&2
            exit 65
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest the approved digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          # Defence in depth: the job-level guard is the primary control, and
          # this keeps signing impossible if that guard is ever edited away.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "refusing to sign a non-tag ref: $GITHUB_REF" >&2; exit 65 ;;
          esac
          cosign sign --yes "$IMAGE"
          cosign attest --yes \
            --predicate "evidence/sbom-${COMPONENT}.spdx.json" \
            --type spdxjson "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > "signature-${COMPONENT}.json"
          jq -e 'length > 0' "signature-${COMPONENT}.json" >/dev/null
      - name: Publish signature evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-signature-${{ github.sha }}-${{ matrix.component }}
          if-no-files-found: error
          retention-days: 90
          path: signature-${{ matrix.component }}.json
