    "/api/feed/messages": {
      "get": {
        "summary": "Read historical messages for one channel",
        "operationId": "get-feed-messages",
        "tags": [
          "public"
        ],
        "x-access": "public",
        "parameters": [
          {
            "name": "channel",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]*$",
              "maxLength": 64
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "maxItems": 50,
                  "items": {
                    "type": "object",
                    "required": [
                      "time",
                      "packet_hash",
                      "packet_type"
                    ],
                    "properties": {
                      "time": {
                        "type": "string",
                        "format": "date-time"
                      },
                      "packet_hash": {
                        "type": "string"
                      },
                      "packet_type": {
                        "type": "integer",
                        "const": 5
                      },
                      "summary": {
                        "type": [
                          "string",
                          "null"
                        ]
                      }
                    },
                    "additionalProperties": true
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid or out-of-bounds request",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error"
                  ],
                  "properties": {
                    "error": {
