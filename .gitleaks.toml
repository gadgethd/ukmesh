  '''848469a776c39f8bf2b774def5cd697b''',  # #dartford
  '''84eed36f62c7b22527dbf8883585ad14''',  # #denhaag
  '''4c3e09555ad74fde17f3a82febb610c4''',  # #derbyshire
  '''cbd7337937131f7db971cfdb24431ae3''',  # #devon
  '''d2de225d13760cf2e13aa368ef9e5b6b''',  # #dorset
  '''8792638977132bc05a1f72d6bb913694''',  # #dublin
  '''5d25cf40b1f5b4a7eb0cf9703634a948''',  # #echo
  '''f4624be48a6c80309b4c2f6f3eb36e99''',  # #g8py
  '''ea6b521f794e7a0e4ff41fe5d0e3f838''',  # #glasgow
  '''83c8b01997654265938da8765cbc7db9''',  # #hamradio
  '''549a4cd97d96c130d359748c72f0e321''',  # #huddersfield
  '''1b2a12acc5db1517d9d407946756b1da''',  # #ireland
  '''dea8bb392991eeee26806e4d2cdf8dd4''',  # #kent
  '''2ca4f626387ca26ec7c2ae45641f9628''',  # #leicester
  '''2db23106132a517f0b9ea47b4d822c4f''',  # #lincolnshire
  '''2a223c8f7b4190b329f46d54d3a9c350''',  # #liverpool
  '''9881d2b7ab9105a41a8d0f6ba449447e''',  # #london
  '''3238ea75dcefd77a31ce907037901f61''',  # #marple
  '''5b664cde0b08b220612113db980650f3''',  # #mesh
  '''ba3707a0760d156169aea2a6c82e2d6a''',  # #midlands
