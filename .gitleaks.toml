title = "UK Mesh gitleaks configuration"

[extend]
useDefault = true

# Global exemptions. These values are published by protocol or are explicitly
# synthetic fixtures, so they are safe wherever they appear (including history
# reachable from other branches). Confidential channel material belongs in
# MESHCORE_CHANNEL_SECRETS, never in this file.
[[allowlists]]
description = "Protocol-default channel PSKs and synthetic/identity fixtures that are public by construction."
regexes = [
  # Fixed CI-only health-check channel fixture, with no production authority.
  '''0123456789abcdef0123456789abcdef''',
  # MeshCore 'Public' channel PSK. The protocol ships it as an app default and
  # it appears verbatim in unrelated public MeshCore projects, so it is
  # published by construction, not a credential.
  '''8b3387e9c5cdea6ac9e5edbaa115cd72''',
  # MeshCore 'public2' channel PSK (the protocol's second built-in public
  # channel). Also an app default, and present in
  # backend/src/mqtt/channelRegistry.meshos.test.ts as PUBLIC2_SECRET, which the
  # generic-api-key rule flags purely on the constant's name.
  '''8b4b705b080c0d943b1c80f6b3ef6b6d''',
  # MeshCore node public keys used as fixtures in the backend/src/mqtt test
  # suite (commit c0eac55). A node public key is the node's advertised
  # identity in meshcore/<IATA>/<KEY>/packets topics, published by design --
  # not a credential.
  '''67969D8FF8A2DE6FFF873638CCAB3F70E38111BE3BD599F75E9D21D907B217B5''',
  '''8CA23B78908F366D2D9F63EFE4A5726D685332FD3EC9AFF1B3B6CFF22EC2AE8A''',
  # Public MeshCore repeater node-key fixture used by the HopReach share-API
  # on-demand RF footprint test (hopreach-shareapi/nodes_test.go, commit
  # 262cc09). An advertised node identity is public by design, not a
  # credential; the test builds it at runtime and this entry covers the
  # history of that fixture so --all scans stay clean.
  '''85953e404cd421a5d845051a8674d52bc38de2972f2357072ec1e79a79be47ed''',
  # Synthetic harness credentials written by scripts/test-lean-runtime.py and
  # scripts/full-dev/* when they stand up a throwaway Compose stack. The
  # literals announce themselves as fixtures ("owned-fixture-only",
  # "owned-fixture-secret-at-least-32-characters", "owned-synthetic-1x"); every
  # service they configure is created by the test and torn down after it, and
  # none can be used against a real deployment.
  '''owned-fixture-only''',
  '''owned-fixture-secret-at-least-32-characters''',
  '''owned-synthetic-1x''',
]

# Hashtag channel keys are public by construction: sha256("#<channel name>")[:32]
# means knowing the name alone reproduces the key. They are still scoped to the
# files where the reviewed values legitimately live, so the same 32-hex string
# pasted into any other file is reported instead of silently exempted. Each
# regex is listed verbatim so renaming a constant to FOO_SECRET cannot re-break
# the scan; the trailing comment names the channel that reproduces it.
[[allowlists]]
description = "Reviewed hashtag channel keys, limited to the channel registry, its tests, and the historical derivation fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^[.]gitleaks[.]toml$''',
  '''backend/src/mqtt/channelRegistry[.]ts$''',
  '''backend/src/mqtt/channelRegistry[.]meshos[.]test[.]ts$''',
  '''backend/src/mqtt/channelRegistry[.]provenance[.]test[.]ts$''',
  # docs/decryption.md documents the Public channel PSK; included so a future
  # reviewed hashtag derivation there is not treated as a leak.
  '''docs/decryption[.]md$''',
  # Historical #test derivations in the throwaway local-companion fixtures.
  '''scripts/companion-dev/corescope[.]json$''',
  '''scripts/full-dev/compose[.]yml$''',
  '''scripts/full-dev/replay/prepare[.]py$''',
]
regexes = [
