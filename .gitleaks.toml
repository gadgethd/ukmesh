title = "UK Mesh gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Reviewed MeshCore public-channel material: the documented public channel key is published by the protocol, is not an application credential, and must not be treated as a leak. Private channel material enters only via MESHCORE_CHANNEL_SECRETS."
regexes = [
  # Fixed CI-only health-check channel fixture, with no production authority.
  '''0123456789abcdef0123456789abcdef''',
  '''8b3387e9c5cdea6ac9e5edbaa115cd72''',
  # ── Hashtag channel keys ───────────────────────────────────────────────
  # Every value below is sha256("#<channel name>")[:32]: knowing the
  # channel name alone reproduces the key, so these are public by
  # construction, not credentials. Listed verbatim (rather than derived at
  # runtime) so renaming a constant to something like FOO_SECRET cannot
  # re-break the secret scan; the trailing comment is the channel name that
  # reproduces each key.
  '''eb50a1bcb3e4e5d7bf69a57c9dada211''',  # #bot
  '''b4e5450da06c21e5338b91b3b18206ad''',  # #brentwood
