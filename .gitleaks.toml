title = "UK Mesh gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Reviewed MeshCore public-channel material: the documented public channel key is published by the protocol, is not an application credential, and must not be treated as a leak. Private channel material enters only via MESHCORE_CHANNEL_SECRETS."
regexes = [
  # Fixed CI-only health-check channel fixture, with no production authority.
  '''0123456789abcdef0123456789abcdef''',
  '''8b3387e9c5cdea6ac9e5edbaa115cd72''',
  # MeshCore node public keys used as fixtures in the backend/src/mqtt test
  # suite (commit c0eac55). A node public key is the node's advertised
  # identity in meshcore/<IATA>/<KEY>/packets topics, published by design --
  # not a credential. Kept here rather than per-line in .gitleaksignore so
  # the allowance survives edits to the test files.
  '''67969D8FF8A2DE6FFF873638CCAB3F70E38111BE3BD599F75E9D21D907B217B5''',
  '''8CA23B78908F366D2D9F63EFE4A5726D685332FD3EC9AFF1B3B6CFF22EC2AE8A''',
  # Public MeshCore repeater node-key fixture used by the HopReach share-API
  # on-demand RF footprint test (hopreach-shareapi/nodes_test.go, commit
  # 262cc09). An advertised node identity is public by design, not a
  # credential; the test builds it at runtime and this entry covers the
  # history of that fixture so --all scans stay clean.
  '''85953e404cd421a5d845051a8674d52bc38de2972f2357072ec1e79a79be47ed''',
]

# The public2 protocol key is public channel material, including this decoder fixture.
# Require the exact value AND exact test path; private values still fail here.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed public2 material in the MeshOS decoder fixture, stable across branch rebases"
condition = "AND"
regexTarget = "secret"
regexes = ['''(?i)^8b4b705b080c0d943b1c80f6b3ef6b6d$''']
paths = ['''(^|/)backend/src/mqtt/channelRegistry\.meshos\.test\.ts$''']
