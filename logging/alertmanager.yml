global:
  resolve_timeout: 5m

route:
  receiver: operations-receiver
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: operations-receiver
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Provisioned at deploy time with the same value as
            # ALERT_RECEIVER_TOKEN; the receiver rejects unauthenticated posts.
            credentials_file: /etc/alertmanager/alert_receiver_token

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]
