global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/meshcore.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: meshcore-backend
    metrics_path: /metrics
    static_configs:
      - targets: [backend:9091]

  - job_name: meshcore-workers
    static_configs:
      - targets: [health-worker:9091]
        labels:
          role: health
      - targets: [path-learning-worker:9091]
        labels:
          role: path_learning
      - targets: [synthetic-monitor:9091]
        labels:
          role: synthetic
      - targets: [link-worker:9091]
        labels:
          role: link

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: meshcore-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:3000/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: mosquitto-broker
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - mosquitto:9001
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: meshcore-synthetic
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app-ukmesh:8080/
          - http://website-ukmesh:8080/
          - http://mesh-health-check:3090/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
