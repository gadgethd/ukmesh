# Local-only Mosquitto configuration for sample replay.
#
# Bound to all interfaces *inside* its container; publish ports to the host
# loopback only. Anonymous access is intentional: this broker exists solely
# for local sample replay and must never be exposed beyond localhost.
# Bound replay bursts explicitly. Mosquitto's default 1,000-message subscriber
# queue otherwise drops part of a 2,000-message saturation fixture before the
# durable consumer can apply backpressure. Both limits are per client.
max_queued_messages 10000
max_queued_bytes 16777216

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence false
log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true
