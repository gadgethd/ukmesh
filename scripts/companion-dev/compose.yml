name: ukmesh-companions
x-service-journal: &service-journal
  driver: journald
  options:
    tag: "{{.Name}}"
    labels: "com.docker.compose.service,com.docker.compose.project"
x-go: &go
  logging: *service-journal
  image: golang@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea # 1.27-bookworm, native cgo
  user: "${COMPANION_UID:-1000}:${COMPANION_GID:-1000}"
  environment: &go-env
    HOME: /tmp
    GOCACHE: /cache/build
    GOPATH: /cache/go
    GOMAXPROCS: "2"
    GOFLAGS: "-mod=readonly -p=2"
  init: true
services:
  build:
    <<: *go
    profiles: [tools]
    working_dir: /src
    environment:
      <<: *go-env
      COMPANION_CORESCOPE_COMMIT: "${COMPANION_CORESCOPE_COMMIT:-unknown}"
    entrypoint: [bash, /dev-tools/build.sh]
    volumes:
      - ../../third_party/corescope:/src/corescope:ro
      - ../../third_party/beacon-server:/src/beacon-server:ro
      - ../../plans/companion-dev/runtime/bin:/out
      - ../../plans/companion-dev/go-cache:/cache/build
      - ../../plans/companion-dev/go-mod:/cache/go
      - .:/dev-tools:ro
    mem_limit: &companion-build-memory 1200m
    memswap_limit: *companion-build-memory
  beacon-db:
    logging: *service-journal
    restart: unless-stopped
    image: postgres@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca # 16-bookworm
    environment:
      POSTGRES_USER: beacon_dev
      POSTGRES_PASSWORD: local-companion-only
      POSTGRES_DB: beacon_dev
    ports: ["127.0.0.1:5435:5432"]
    volumes: [beacon-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U beacon_dev -d beacon_dev"]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: &companion-beacon-db-memory 512m
    memswap_limit: *companion-beacon-db-memory
    shm_size: 1g
  beacon-redis:
    logging: *service-journal
    restart: unless-stopped
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: &companion-beacon-redis-memory 128m
    memswap_limit: *companion-beacon-redis-memory
  corescope-ingestor:
    <<: *go
    restart: unless-stopped
    environment:
      <<: *go-env
      GOMEMLIMIT: ${CORESCOPE_INGEST_GOMEMLIMIT:-192MiB}
      COMPANION_SOURCE_REVISION: ${COMPANION_CORESCOPE_SOURCE:-unknown}
      COMPANION_CONFIG_REVISION: ${COMPANION_CORESCOPE_CONFIG:-unknown}
    volumes:
      - ../../plans/companion-dev/runtime/bin:/bin/companions:ro
      - ${CORESCOPE_DATA_DIR:-../../plans/companion-dev/runtime/corescope}:/data
      - ./corescope.json:/config/config.json:ro
    # Absolute executable paths avoid PATH or inherited environment overrides.
    entrypoint: [/bin/companions/corescope-ingestor, -config, /config/config.json]
    command: []
    networks: [default, sample]
    healthcheck:
      test: [CMD-SHELL, "test -s /data/analyzer.db"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: &companion-corescope-ingestor-memory 256m
    memswap_limit: *companion-corescope-ingestor-memory
    stop_grace_period: 30s
  corescope:
    <<: *go
    restart: unless-stopped
    environment:
      <<: *go-env
      # Leave room under the cgroup limit for SQLite and other native allocations.
      GOMEMLIMIT: ${CORESCOPE_WEB_GOMEMLIMIT:-256MiB}
      COMPANION_SOURCE_REVISION: ${COMPANION_CORESCOPE_SOURCE:-unknown}
      COMPANION_CONFIG_REVISION: ${COMPANION_CORESCOPE_CONFIG:-unknown}
    entrypoint: [/bin/companions/corescope-server, -config-dir, /config, -public, /public]
    command: []
    ports: ["127.0.0.1:3102:3000"]
    volumes:
      - ../../plans/companion-dev/runtime/bin:/bin/companions:ro
      - ${CORESCOPE_DATA_DIR:-../../plans/companion-dev/runtime/corescope}:/data
      - ../../third_party/corescope/public:/public:ro
      - ./corescope.json:/config/config.json:ro
    depends_on:
      corescope-ingestor: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/api/stats]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s
    mem_limit: &companion-corescope-memory 512m
    memswap_limit: *companion-corescope-memory
  beacon-migrate:
    <<: *go
    entrypoint: [/bin/companions/beacon, --migrate-only, --attest-migrations]
    command: []
    environment:
      <<: *go-env
      POSTGRES_DSN: postgres://beacon_dev:local-companion-only@beacon-db:5432/${BEACON_DATABASE:-beacon_dev}?sslmode=disable
    volumes:
      - ../../plans/companion-dev/runtime/bin:/bin/companions:ro
    depends_on:
      beacon-db: {condition: service_healthy}
    restart: "no"
    mem_limit: &companion-beacon-migrate-memory 256m
    memswap_limit: *companion-beacon-migrate-memory
  beacon:
    <<: *go
    restart: unless-stopped
    entrypoint: [/bin/companions/beacon]
    command: []
    working_dir: /tmp
    environment:
      <<: *go-env
      LISTEN_ADDR: ":8080"
      COMPANION_SOURCE_REVISION: ${COMPANION_BEACON_SOURCE:-unknown}
      COMPANION_CONFIG_REVISION: ${COMPANION_BEACON_CONFIG:-unknown}
      POSTGRES_DSN: postgres://beacon_runtime:local-full-dev-only@beacon-db:5432/${BEACON_DATABASE:-beacon_dev}?sslmode=disable
      BEACON_MAINTENANCE_DSN: postgres://beacon_maint:local-full-dev-only@beacon-db:5432/${BEACON_DATABASE:-beacon_dev}?sslmode=disable
      BEACON_EXTERNAL_MIGRATIONS: "1"
      REDIS_ADDR: beacon-redis:6379
      CONFIG_PATH: /config/beacon.yaml
      MQTT_BROKER_1_URL: tcp://ukmesh-sample-mqtt:1883
    ports: ["127.0.0.1:3103:8080"]
    volumes:
      - ../../plans/companion-dev/runtime/bin:/bin/companions:ro
      - ./beacon.yaml:/config/beacon.yaml:ro
    networks: [default, sample]
    depends_on:
      beacon-db: {condition: service_healthy}
      beacon-redis: {condition: service_healthy}
      beacon-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/v1/info]
      interval: 3s
      timeout: 3s
      retries: 60
    mem_limit: &companion-beacon-memory 384m
    memswap_limit: *companion-beacon-memory
    stop_grace_period: 30s
  web-build:
    logging: *service-journal
    image: node@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    profiles: [tools]
    user: "${COMPANION_UID:-1000}:${COMPANION_GID:-1000}"
    working_dir: /work
    environment:
      HOME: /tmp
      VITE_API_BASE: /api/v1
      BEACON_DEV_ENV_DIR: /tmp/ukmesh-empty-env
    volumes:
      - ../../third_party/beacon-web:/work:ro
      - ../../third_party/beacon-web/node_modules:/work/node_modules
      - ../../plans/companion-dev/runtime/npm-cache:/npm-cache
      - ../../plans/companion-dev/runtime/beacon-web.next:/out
      - .:/dev-tools:ro
    entrypoint: [sh, /dev-tools/web-build.sh]
    mem_limit: &companion-web-build-memory 1200m
    memswap_limit: *companion-web-build-memory
  beacon-web:
    logging: *service-journal
    restart: unless-stopped
    image: ${APP_IMAGE:-ukmesh-full-app:local}
    environment:
      COMPANION_SOURCE_REVISION: ${COMPANION_WEB_SOURCE:-unknown}
      COMPANION_PUBLICATION_REVISION: ${COMPANION_WEB_PUBLICATION:-unknown}
      COMPANION_CONFIG_REVISION: ${COMPANION_WEB_CONFIG:-unknown}
    ports: ["127.0.0.1:5175:8080"]
    volumes:
      - ../../plans/companion-dev/runtime/beacon-web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0755
    depends_on:
      beacon: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/api/v1/info >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: &companion-beacon-web-memory 48m
    memswap_limit: *companion-beacon-web-memory

volumes:
  beacon-db:
networks:
  sample:
    name: ukmesh-sample_default
    external: true
