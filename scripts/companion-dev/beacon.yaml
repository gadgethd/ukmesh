# Fixture broker only. Beacon owns its database; no UKMesh DSN or credentials.
log: {level: info, format: text}
# Local operator reads existing metrics inside this container; no host port.
server: {admin_listen: "127.0.0.1:9091"}
websocket:
  max_connections: 1000
  max_connections_per_ip: 50
  max_connects_per_minute: 60
  allowed_origins: ["http://127.0.0.1:5175", "http://localhost:5175"]
cors:
  allowed_origins: ["http://127.0.0.1:5175", "http://localhost:5175"]
iatas:
  LON: {name: London}
  LHR: {name: London Heathrow}
regions:
  - slug: dev
    name: DEV fixture
    iatas: [LON, LHR]
channel_keys:
  hashtags:
    - name: test
