# The enclosing DEV server sets $beacon_projection to the private listener.
location = /feed {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    alias /srv/beacon-feed/ukmesh-feed.html;
    default_type text/html;
    disable_symlinks on;
    expires -1;
}

location ~ ^/beacon-feed/assets/(?<beacon_asset>[A-Za-z0-9_-]+\.(?:js|css))$ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    alias /srv/beacon-feed/assets/$beacon_asset;
    disable_symlinks on;
}

location ~ "^/beacon/(?:readyz|api/v1/(?:iatas|regions|channels(?:/[1-9][0-9]{0,15}/messages)?))$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    include /etc/nginx/ukmesh-ingress/public-proxy.inc;
    rewrite ^/beacon(/.*)$ $1 break;
    proxy_pass $beacon_projection$uri$is_args$args;
}

location = /beacon/ws {
    if ($request_method != GET) { return 405; }
    if ($http_upgrade !~* ^websocket$) { return 426; }
    include /etc/nginx/ukmesh-ingress/public-proxy.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    # Beacon clients ping every 30 seconds. Leave headroom for a delayed ping.
    proxy_read_timeout 75s;
    proxy_pass $beacon_projection/ws$is_args$args;
}

location /beacon/ { return 404; }
location /beacon-feed/ { return 404; }
