name: ukmesh-lan

# LAN-facing layer for the canonical DEV stack. It does not duplicate any
# runtime: it joins the existing stack networks and publishes fixed ports.
# The launcher renders the interface bindings from routes.json.

services:
  site:
    image: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
    container_name: ukmesh-lan-site
    command: ["node", "/srv/server.mjs"]
    environment:
      PORT: "8080"
      PROBE_TIMEOUT_MS: "2500"
    volumes:
      - ./site:/srv:ro
    networks: [full, companions]
    mem_limit: 96m
    memswap_limit: 96m
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: ukmesh-lan-gateway
    volumes:
      - ./lan-proxy.inc:/etc/nginx/lan-proxy.inc:ro
    networks: [full, companions]
    mem_limit: 64m
    memswap_limit: 64m
    restart: "no"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  full:
    external: true
    name: ukmesh-full_default
  companions:
    external: true
    name: ukmesh-companions_default
