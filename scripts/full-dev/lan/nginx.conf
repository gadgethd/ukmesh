map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# LAN access gateway. Each service listens on a fixed public port and proxies to
# the stack over Docker DNS. Variable proxy_pass + resolver keeps upstreams
# re-resolved after stack restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8081;
    set $upstream http://app-ukmesh:8080;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8082;
    set $upstream http://corescope:3000;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8083;
    set $upstream http://website-ukmesh:8080;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8084;
    set $upstream http://beacon-web:8080;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8085;
    set $upstream http://grafana:3000;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8086;
    set $upstream http://prometheus:9090;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8087;
    set $upstream http://website-dev:8080;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8088;
    set $upstream http://beacon:8080;
    include /etc/nginx/lan-proxy.inc;
}

server {
    listen 8089;
    set $upstream http://mesh-health-check:3090;
    include /etc/nginx/lan-proxy.inc;
}
