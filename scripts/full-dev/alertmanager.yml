global:
  resolve_timeout: 5m
route:
  receiver: local-test
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: local-test
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: local-full-alert-token-0123456789abcdef
