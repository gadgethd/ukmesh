  app-ukmesh:
    <<: [*internal-hosts, *application-hardening]
    image: ${APP_IMAGE:-meshcore-analytics-app:local}
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
        VITE_APP_HOSTNAME: app.ukmesh.com
        VITE_BUILD_TARGET: app
        VITE_NETWORK: ukmesh
        VITE_SITE: ukmesh
        VITE_RF_COVERAGE_ENABLED: ${RF_COVERAGE_ENABLED:-true}
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:8080"
    networks:
      default:
        ipv4_address: 172.30.0.10
    volumes:
      - ${TERRAIN_TILES_PATH:-./terrain-tiles}:/terrain-tiles:ro
      - rf_coverage_data:/rf-coverage-data:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s

  website-ukmesh:
    <<: [*internal-hosts, *application-hardening]
    image: ${WEBSITE_IMAGE:-meshcore-analytics-website:local}
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
        VITE_APP_HOSTNAME: app.ukmesh.com
        VITE_BUILD_TARGET: public-website
        VITE_SITE: ukmesh
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    ports:
      - "127.0.0.1:3004:8080"
    networks:
      default:
        ipv4_address: 172.30.0.11
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s

  mesh-health-check-data-init:
    <<: *application-hardening
    image: ${HEALTHCHECK_IMAGE:-meshcore-analytics-health-check:local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        touch /app/data/.meshcore-initialized
        chown -R node:node /app/data
        find /app/data -xdev -type f -exec chmod 0640 {} +
        chmod 0750 /app/data
    restart: "no"
    network_mode: "none"
    mem_limit: "64m"
    memswap_limit: "64m"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - mesh_health_check_data:/app/data

  mesh-health-check:
    <<: [*internal-hosts, *application-hardening]
    image: ${HEALTHCHECK_IMAGE:-meshcore-analytics-health-check:local}
    build:
      context: .
      dockerfile: Dockerfile.mesh-health-check
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
        MESH_HEALTH_CHECK_REF: ${HEALTHCHECK_SOURCE_REF:?HEALTHCHECK_SOURCE_REF full commit required}
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    environment:
      PORT: "3090"
      APP_TITLE: ${HEALTHCHECK_APP_TITLE:-UKMesh Health Check}
      APP_EYEBROW: ${HEALTHCHECK_APP_EYEBROW:-MeshCore Observer Coverage}
      APP_HEADLINE: ${HEALTHCHECK_APP_HEADLINE:-Check your UK mesh reach.}
      APP_DESCRIPTION: ${HEALTHCHECK_APP_DESCRIPTION:-Generate a test code, send it to the configured channel, and watch observer coverage build in real time.}
      EXTERNAL_LINK_URL: ${HEALTHCHECK_EXTERNAL_LINK_URL:-https://ukmesh.com}
      EXTERNAL_LINK_LABEL: ${HEALTHCHECK_EXTERNAL_LINK_LABEL:-UKMesh}
      LOG_LEVEL: ${HEALTHCHECK_LOG_LEVEL:-info}
      TRUST_PROXY: "1"
      MQTT_HOST: mosquitto
      MQTT_PORT: "9001"
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${HEALTHCHECK_MQTT_TOPIC:-meshcore/+/+/packets,meshcore/+/+/status,meshcore/+/+/internal}
      MQTT_TRANSPORT: websockets
      MQTT_WS_PATH: /
      MQTT_TLS: "false"
      DASH_BROKER_HOST: ${HEALTHCHECK_DASH_BROKER_HOST:-mqtt.ukmesh.com}
      TEST_CHANNEL_NAME: ${HEALTHCHECK_TEST_CHANNEL_NAME:-ukmeshtest}
      TEST_CHANNEL_SECRET: ${HEALTHCHECK_TEST_CHANNEL_SECRET:-}
      TEST_CHANNEL_SECRET_SOURCE_NAME: ${HEALTHCHECK_TEST_CHANNEL_SECRET_SOURCE_NAME:-test}
      TEST_CHANNEL_HASH: ${HEALTHCHECK_TEST_CHANNEL_HASH:-}
      MESHCORE_CHANNEL_SECRETS: ${MESHCORE_CHANNEL_SECRETS:-}
      SESSION_TTL_SECONDS: ${HEALTHCHECK_SESSION_TTL_SECONDS:-600}
      RESULT_RETENTION_SECONDS: ${HEALTHCHECK_RESULT_RETENTION_SECONDS:-604800}
      MAX_USES_PER_CODE: ${HEALTHCHECK_MAX_USES_PER_CODE:-3}
      KNOWN_OBSERVERS: ${HEALTHCHECK_KNOWN_OBSERVERS:-}
      OBSERVER_ACTIVE_WINDOW_SECONDS: ${HEALTHCHECK_OBSERVER_ACTIVE_WINDOW_SECONDS:-900}
      OBSERVER_RETENTION_SECONDS: ${HEALTHCHECK_OBSERVER_RETENTION_SECONDS:-14400}
      OBSERVERS_FILE: /app/data/observer.json
      RESULTS_FILE: /app/data/session-results.json
      REGIONS_FILE: ${HEALTHCHECK_REGIONS_FILE:-regions/uk.geojson}
      TURNSTILE_ENABLED: ${HEALTHCHECK_TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${HEALTHCHECK_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${HEALTHCHECK_TURNSTILE_SECRET_KEY:-}
    depends_on:
      mesh-health-check-data-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:3090:3090"
    volumes:
      - mesh_health_check_data:/app/data
      - ./healthcheck-overrides/index.html:/app/public/index.html:ro
      - ./healthcheck-overrides/share.html:/app/public/share.html:ro
      - ./healthcheck-overrides/sw.js:/app/public/sw.js:ro
      - ./healthcheck-overrides/ukmesh-theme.css:/app/public/ukmesh-theme.css:ro
    healthcheck:
      # The upstream app has no /healthz route; its SPA fallback returns 200
      # there even when the API is unavailable. Probe a real JSON endpoint.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3090/api/bootstrap').then(r=>process.exit(r.ok && (r.headers.get('content-type') || '').includes('application/json') ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  website-dev:
    <<: [*internal-hosts, *application-hardening]
    image: ${WEBSITE_DEV_IMAGE:-meshcore-analytics-website-dev:local}
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
        VITE_APP_HOSTNAME: ${VITE_DEV_APP_HOSTNAME:-test.ukmesh.com}
        VITE_BUILD_TARGET: dev-website
        VITE_NETWORK: test
        VITE_SITE: dev
        VITE_OBSERVER_ID: ${VITE_DEV_OBSERVER_ID:-}
        VITE_SITE_DISPLAY_NAME: ${VITE_DEV_SITE_DISPLAY_NAME:-UK Mesh Test}
        VITE_SITE_FOOTER_NAME: ${VITE_DEV_SITE_FOOTER_NAME:-UK Mesh Test}
        VITE_SITE_APP_URL: ${VITE_DEV_SITE_APP_URL:-https://test.ukmesh.com}
        VITE_SITE_HOME_URL: ${VITE_DEV_SITE_HOME_URL:-https://test.ukmesh.com}
    restart: always
    profiles: [dev]
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    ports:
      - "127.0.0.1:3006:8080"
    networks:
      default:
        ipv4_address: 172.30.0.12
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s

  # ── Anubis bot protection ─────────────────────────────────────────────────────
  # One sidecar per public HTTP service. Cloudflare Tunnel routes to these
  # containers (port 8923) instead of the origin services directly.
  # MQTT (mosquitto:9001) is intentionally excluded — non-browser clients.
  # Dev services are intentionally excluded — low value.

  anubis-website-ukmesh:
    <<: [*anubis-base, *internal-hosts]
    mem_limit: "128m"
    memswap_limit: "128m"
    environment:
      ED25519_PRIVATE_KEY_HEX: "${ANUBIS_ED25519_PRIVATE_KEY_HEX:?ANUBIS_ED25519_PRIVATE_KEY_HEX required}"
      BIND: ":8923"
      TARGET: "http://website-ukmesh:8080"
      COOKIE_DOMAIN: "ukmesh.com"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_EXPIRATION_TIME: "168h"
      POLICY_FNAME: "/data/botPolicy.yaml"
      SLOG_LEVEL: "INFO"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
    depends_on:
      website-ukmesh:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.20

  anubis-app-ukmesh:
    <<: [*anubis-base, *internal-hosts]
    mem_limit: "128m"
    memswap_limit: "128m"
    environment:
      ED25519_PRIVATE_KEY_HEX: "${ANUBIS_ED25519_PRIVATE_KEY_HEX:?ANUBIS_ED25519_PRIVATE_KEY_HEX required}"
      BIND: ":8923"
      TARGET: "http://app-ukmesh:8080"
      COOKIE_DOMAIN: "ukmesh.com"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_EXPIRATION_TIME: "168h"
      POLICY_FNAME: "/data/botPolicy.yaml"
      SLOG_LEVEL: "INFO"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
    depends_on:
      app-ukmesh:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.21

  anubis-health-check:
    <<: [*anubis-base, *internal-hosts]
    mem_limit: "128m"
    memswap_limit: "128m"
    environment:
      ED25519_PRIVATE_KEY_HEX: "${ANUBIS_ED25519_PRIVATE_KEY_HEX:?ANUBIS_ED25519_PRIVATE_KEY_HEX required}"
      BIND: ":8923"
      TARGET: "http://mesh-health-check:3090"
      COOKIE_DOMAIN: "ukmesh.com"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_EXPIRATION_TIME: "168h"
      POLICY_FNAME: "/data/botPolicy.yaml"
      SLOG_LEVEL: "INFO"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
    depends_on:
      mesh-health-check:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.22
        # Cloudflare Tunnel currently routes healthcheck.ukmesh.com to
        # http://anubis-mesh-health-check:8923. Keep this alias unless the
        # tunnel ingress config is changed at Cloudflare too.
        aliases:
          - anubis-mesh-health-check

  cloudflared:
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: always
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    command: tunnel run
    profiles: [tunnel]
    networks:
      default:
        ipv4_address: 172.30.0.30
      meshcore-beacon-ukmesh: {}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
      anubis-website-ukmesh:
        condition: service_started
      anubis-app-ukmesh:
        condition: service_started
      anubis-health-check:
        condition: service_started

  loki:
    <<: *internal-hosts
    image: grafana/loki@sha256:5fe9fa99e9a747297cdf0239a5b25d192d8f668bd6505b09beef4dffcab5aac2
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: -config.file=/etc/loki/loki.yaml
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./logging/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  alloy:
    <<: *internal-hosts
    image: grafana/alloy@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "256m"
    memswap_limit: "256m"
    user: "473:473"
    group_add:
      - "${JOURNAL_GID:-999}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy
    healthcheck:
      test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    <<: *internal-hosts
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: always
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./logging/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./logging/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      postgres-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      blackbox-exporter:
        condition: service_healthy

  grafana:
    <<: *internal-hosts
    image: grafana/grafana@sha256:0a2874cf39c6487093c682215f7c7903ed8646d78ae5f911af945d2dfcc0a447
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logging/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  alert-receiver:
    <<: *internal-hosts
    image: ${BACKEND_IMAGE:-meshcore-analytics-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
    command: ["node", "dist/workers/alert-receiver.js"]
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ALERT_FORWARD_URL: ${ALERT_FORWARD_URL:-}
      ALERT_RECEIVER_PATH: /var/lib/meshcore-alerts/alerts.jsonl
      NODE_ENV: production
    volumes:
      - alert_receiver_data:/var/lib/meshcore-alerts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  alertmanager:
    <<: *internal-hosts
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./logging/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      alert-receiver:
        condition: service_healthy

  postgres-exporter:
    <<: *internal-hosts
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:fb96c4413985d4b23ab02b19022b3d70a86c8e0a62f41ab15ebb6f4673781a5d
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}?sslmode=disable
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      timescaledb:
        condition: service_healthy

  redis-exporter:
    <<: *internal-hosts
    image: oliver006/redis_exporter@sha256:4c8000eb3525e0f6ed1327499861e272fcce358a9e7a87dd9db74c44607e6d8e
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: meshcore:link:v3:worker_heartbeat
    healthcheck:
      test: ["CMD", "/redis_exporter", "-version"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    <<: *internal-hosts
    image: prom/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5

  blackbox-exporter:
    <<: *internal-hosts
    image: prom/blackbox-exporter@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./logging/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "/bin/blackbox_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  default:
    ipam:
      config:
        # Fixed proxy addresses make the backend's immediate-peer trust exact.
        - subnet: 172.30.0.0/24
  meshcore-beacon-ukmesh:
    external: true
    name: meshcore-beacon-ukmesh_default

volumes:
  timescaledb_data:
  mosquitto_data:
  mosquitto_log:
  redis_data:
  srtm_data:
  loki_data:
  grafana_data:
  prometheus_data:
  alloy_data:
  alert_receiver_data:
  alertmanager_data:
  mesh_health_check_data:
  rf_coverage_data:
