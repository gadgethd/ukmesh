x-anubis-base: &anubis-base
  image: ghcr.io/techarohq/anubis:v1.25.0
  restart: always
  logging: &json-log-limits
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./anubis/botPolicy.yaml:/data/botPolicy.yaml:ro

x-internal-hosts: &internal-hosts
  {}  # Docker's internal DNS handles service name resolution

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: always
    logging: *json-log-limits
    mem_limit: "4g"
    memswap_limit: "4g"
    stop_grace_period: 2m
    command: ["postgres", "-c", "max_connections=300", "-c", "max_parallel_workers_per_gather=0"]
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meshcore}
      POSTGRES_USER: ${POSTGRES_USER:-meshcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./backend/src/db/schema/base.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meshcore} -d ${POSTGRES_DB:-meshcore}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  mosquitto:
    <<: *internal-hosts
    image: eclipse-mosquitto:2
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto >/dev/null && nc -z 127.0.0.1 9001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  redis:
    <<: *internal-hosts
    image: redis:7-alpine
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD --no-auth-warning ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Apply additive, versioned migrations once before the application starts.
  # Base schema creation remains in the database init hook for fresh volumes;
  # this service keeps existing volumes current while backend startup stays fast.
  db-migrate:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: "no"
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    command: ["node", "dist/tools/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      DATABASE_STATEMENT_TIMEOUT_MS: 0
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy

  backend:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    logging: *json-log-limits
    mem_limit: "1g"
    memswap_limit: "1g"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-ws://mosquitto:9001}
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      OPENTOPODATA_API: ${OPENTOPODATA_API:-https://api.opentopodata.org}
      PORT: ${PORT:-3000}
      MESHCORE_CHANNEL_SECRETS: ${MESHCORE_CHANNEL_SECRETS:-}
      OWNER_DATABASE_URL: ${OWNER_DATABASE_URL:-postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${OWNER_POSTGRES_DB:-meshcore_owner_auth}}
      OWNER_MQTT_USERNAME_MAP: ${OWNER_MQTT_USERNAME_MAP:-}
      OWNER_COOKIE_SECRET: ${OWNER_COOKIE_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3003,http://localhost:3004,https://ukmesh.com,https://www.ukmesh.com,https://app.ukmesh.com,https://test.ukmesh.com}
      RADIO_BOT_URL: ${RADIO_BOT_URL:-}
      VIEWSHED_ENABLED: ${VIEWSHED_ENABLED:-false}
      COVERAGE_MODEL_VERSION: ${COVERAGE_MODEL_VERSION:-5}
      DATABASE_STATEMENT_TIMEOUT_MS: 300000
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_SKIP_SCHEMA_INIT: "true"
      WS_INITIAL_STATE_ENABLED: "1"
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-65536}
      MQTT_INGEST_CONCURRENCY: ${MQTT_INGEST_CONCURRENCY:-8}
      MQTT_INGEST_QUEUE_MAX: ${MQTT_INGEST_QUEUE_MAX:-1000}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-65536}
      WS_MAX_QUEUE_BYTES: ${WS_MAX_QUEUE_BYTES:-8388608}
      WS_MAX_BUFFERED_BYTES: ${WS_MAX_BUFFERED_BYTES:-33554432}
      MAINTENANCE_ACTIVE: ${MAINTENANCE_ACTIVE:-0}
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-}
      VIEWSHED_JOB_COOLDOWN_SECONDS: ${VIEWSHED_JOB_COOLDOWN_SECONDS:-300}
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - mosquitto_log:/mosquitto/log:ro
      - ./mosquitto:/mosquitto/config
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  acl-watcher:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    command: ["node", "dist/workers/acl-watcher.js"]
    environment:
      MOSQUITTO_ACL_PATH: /mosquitto/config/acl
      MOSQUITTO_CONTAINER_NAME: mosquitto
      NODE_ENV: production
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./mosquitto:/mosquitto/config
      - /var/run/docker.sock:/var/run/docker.sock

  path-learning-worker:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: ["node", "dist/workers/path-learning.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      DATABASE_STATEMENT_TIMEOUT_MS: 300000
      DATABASE_SKIP_SCHEMA_INIT: "true"
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  path-history-worker:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: ["node", "dist/workers/path-history.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      DATABASE_STATEMENT_TIMEOUT_MS: 300000
      DATABASE_SKIP_SCHEMA_INIT: "true"
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  health-worker:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: ["node", "dist/workers/health.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      DATABASE_STATEMENT_TIMEOUT_MS: 300000
      DATABASE_SKIP_SCHEMA_INIT: "true"
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  synthetic-monitor:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    command: ["node", "dist/workers/synthetic-monitor.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      DATABASE_SKIP_SCHEMA_INIT: "true"
      SYNTHETIC_BASE_URL: http://backend:3000
      SYNTHETIC_WS_URL: ws://backend:3000
      SYNTHETIC_INTERVAL_MS: ${SYNTHETIC_INTERVAL_MS:-60000}
      SYNTHETIC_TIMEOUT_MS: ${SYNTHETIC_TIMEOUT_MS:-10000}
      SYNTHETIC_FAILURE_THRESHOLD: ${SYNTHETIC_FAILURE_THRESHOLD:-3}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      NODE_ENV: production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  link-backfill-worker:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: "no"
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: ["node", "dist/workers/link-backfill.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-ws://mosquitto:9001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      MESHCORE_CHANNEL_SECRETS: ${MESHCORE_CHANNEL_SECRETS:-}
      DATABASE_SKIP_SCHEMA_INIT: "true"
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  viewshed-worker:
    <<: *internal-hosts
    profiles: [viewshed]
    build:
      context: ./viewshed-worker
      dockerfile: Dockerfile
    restart: always
    logging: *json-log-limits
    mem_limit: "5g"
    memswap_limit: "5g"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      SRTM_DIR: /data/srtm
      WORKER_MODE: viewshed
      VIEWSHED_ENABLED: ${VIEWSHED_ENABLED:-false}
      NUM_WORKERS: '1'
      COVERAGE_MODEL: ${COVERAGE_MODEL:-rf_radial_100m}
      COVERAGE_MODEL_VERSION: ${COVERAGE_MODEL_VERSION:-5}
    volumes:
      - srtm_data:/data/srtm
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: '5g'
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  link-worker:
    <<: *internal-hosts
    build:
      context: ./viewshed-worker
      dockerfile: Dockerfile
    restart: always
    logging: *json-log-limits
    mem_limit: "2g"
    memswap_limit: "2g"
    cpus: 2.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meshcore}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-meshcore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      RADIO_BOT_URL: ${LINK_WORKER_RADIO_BOT_URL:-}
      SRTM_DIR: /data/srtm
      WORKER_MODE: link
      NUM_WORKERS: '1'
    volumes:
      - srtm_data:/data/srtm
    depends_on:
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

