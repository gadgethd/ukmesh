  app-ukmesh:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        VITE_APP_HOSTNAME: app.ukmesh.com
        VITE_NETWORK: ukmesh
        VITE_SITE: ukmesh
        VITE_VIEWSHED_ENABLED: ${VIEWSHED_ENABLED:-false}
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3003:80"
    volumes:
      - ${TERRAIN_TILES_PATH:-./terrain-tiles}:/terrain-tiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s

  website-ukmesh:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        VITE_APP_HOSTNAME: app.ukmesh.com
        VITE_SITE: ukmesh
        VITE_VIEWSHED_ENABLED: ${VIEWSHED_ENABLED:-false}
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    ports:
      - "3004:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s

  mesh-health-check:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.mesh-health-check
      args:
        MESH_HEALTH_CHECK_REF: ${HEALTHCHECK_SOURCE_REF:-main}
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    environment:
      PORT: "3090"
      APP_TITLE: ${HEALTHCHECK_APP_TITLE:-UKMesh Health Check}
      APP_EYEBROW: ${HEALTHCHECK_APP_EYEBROW:-MeshCore Observer Coverage}
      APP_HEADLINE: ${HEALTHCHECK_APP_HEADLINE:-Check your UK mesh reach.}
      APP_DESCRIPTION: ${HEALTHCHECK_APP_DESCRIPTION:-Generate a test code, send it to the configured channel, and watch observer coverage build in real time.}
      EXTERNAL_LINK_URL: ${HEALTHCHECK_EXTERNAL_LINK_URL:-https://ukmesh.com}
      EXTERNAL_LINK_LABEL: ${HEALTHCHECK_EXTERNAL_LINK_LABEL:-UKMesh}
      LOG_LEVEL: ${HEALTHCHECK_LOG_LEVEL:-info}
      TRUST_PROXY: "1"
      MQTT_HOST: mosquitto
      MQTT_PORT: "9001"
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${HEALTHCHECK_MQTT_TOPIC:-meshcore/+/+/packets,meshcore/+/+/status,meshcore/+/+/internal}
      MQTT_TRANSPORT: websockets
      MQTT_WS_PATH: /
      MQTT_TLS: "false"
      DASH_BROKER_HOST: ${HEALTHCHECK_DASH_BROKER_HOST:-mqtt.ukmesh.com}
      TEST_CHANNEL_NAME: ${HEALTHCHECK_TEST_CHANNEL_NAME:-ukmeshtest}
      TEST_CHANNEL_SECRET: ${HEALTHCHECK_TEST_CHANNEL_SECRET:-}
      TEST_CHANNEL_SECRET_SOURCE_NAME: ${HEALTHCHECK_TEST_CHANNEL_SECRET_SOURCE_NAME:-test}
      TEST_CHANNEL_HASH: ${HEALTHCHECK_TEST_CHANNEL_HASH:-}
      MESHCORE_CHANNEL_SECRETS: ${MESHCORE_CHANNEL_SECRETS:-}
      SESSION_TTL_SECONDS: ${HEALTHCHECK_SESSION_TTL_SECONDS:-600}
      RESULT_RETENTION_SECONDS: ${HEALTHCHECK_RESULT_RETENTION_SECONDS:-604800}
      MAX_USES_PER_CODE: ${HEALTHCHECK_MAX_USES_PER_CODE:-3}
      KNOWN_OBSERVERS: ${HEALTHCHECK_KNOWN_OBSERVERS:-}
      OBSERVER_ACTIVE_WINDOW_SECONDS: ${HEALTHCHECK_OBSERVER_ACTIVE_WINDOW_SECONDS:-900}
      OBSERVER_RETENTION_SECONDS: ${HEALTHCHECK_OBSERVER_RETENTION_SECONDS:-14400}
      OBSERVERS_FILE: /app/data/observer.json
      RESULTS_FILE: /app/data/session-results.json
      REGIONS_FILE: ${HEALTHCHECK_REGIONS_FILE:-regions/uk.geojson}
      TURNSTILE_ENABLED: ${HEALTHCHECK_TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${HEALTHCHECK_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${HEALTHCHECK_TURNSTILE_SECRET_KEY:-}
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "3090:3090"
    volumes:
      - mesh_health_check_data:/app/data
      - ./healthcheck-overrides/index.html:/app/public/index.html:ro
      - ./healthcheck-overrides/share.html:/app/public/share.html:ro
      - ./healthcheck-overrides/sw.js:/app/public/sw.js:ro
      - ./healthcheck-overrides/ukmesh-theme.css:/app/public/ukmesh-theme.css:ro
    healthcheck:
      # The upstream app has no /healthz route; its SPA fallback returns 200
      # there even when the API is unavailable. Probe a real JSON endpoint.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3090/api/bootstrap').then(r=>process.exit(r.ok && (r.headers.get('content-type') || '').includes('application/json') ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  website-dev:
    <<: *internal-hosts
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        VITE_APP_HOSTNAME: ${VITE_DEV_APP_HOSTNAME:-app-dev.ukmesh.com}
        VITE_NETWORK: test
        VITE_SITE: dev
        VITE_OBSERVER_ID: ${VITE_DEV_OBSERVER_ID:-}
        VITE_SITE_DISPLAY_NAME: ${VITE_DEV_SITE_DISPLAY_NAME:-UK Mesh Test}
        VITE_SITE_FOOTER_NAME: ${VITE_DEV_SITE_FOOTER_NAME:-UK Mesh Test}
        VITE_SITE_APP_URL: ${VITE_DEV_SITE_APP_URL:-https://test.ukmesh.com}
        VITE_SITE_HOME_URL: ${VITE_DEV_SITE_HOME_URL:-https://test.ukmesh.com}
        VITE_VIEWSHED_ENABLED: ${VIEWSHED_ENABLED:-false}
    restart: always
    logging: *json-log-limits
    mem_limit: "128m"
    memswap_limit: "128m"
    ports:
      - "3006:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s

  # ── Anubis bot protection ─────────────────────────────────────────────────────
  # One sidecar per public HTTP service. Cloudflare Tunnel routes to these
  # containers (port 8923) instead of the origin services directly.
  # MQTT (mosquitto:9001) is intentionally excluded — non-browser clients.
  # Dev services are intentionally excluded — low value.

  anubis-website-ukmesh:
    <<: [*anubis-base, *internal-hosts]
    mem_limit: "128m"
    memswap_limit: "128m"
    environment:
      ED25519_PRIVATE_KEY_HEX: "${ANUBIS_ED25519_PRIVATE_KEY_HEX:?ANUBIS_ED25519_PRIVATE_KEY_HEX required}"
      BIND: ":8923"
      TARGET: "http://website-ukmesh:80"
      COOKIE_DOMAIN: "ukmesh.com"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_EXPIRATION_TIME: "168h"
      POLICY_FNAME: "/data/botPolicy.yaml"
      SLOG_LEVEL: "INFO"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
    depends_on:
      website-ukmesh:
        condition: service_healthy

  anubis-app-ukmesh:
    <<: [*anubis-base, *internal-hosts]
    mem_limit: "128m"
    memswap_limit: "128m"
    environment:
      ED25519_PRIVATE_KEY_HEX: "${ANUBIS_ED25519_PRIVATE_KEY_HEX:?ANUBIS_ED25519_PRIVATE_KEY_HEX required}"
      BIND: ":8923"
      TARGET: "http://app-ukmesh:80"
      COOKIE_DOMAIN: "ukmesh.com"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_EXPIRATION_TIME: "168h"
      POLICY_FNAME: "/data/botPolicy.yaml"
      SLOG_LEVEL: "INFO"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
    depends_on:
      app-ukmesh:
        condition: service_healthy

  anubis-health-check:
    <<: [*anubis-base, *internal-hosts]
    mem_limit: "128m"
    memswap_limit: "128m"
    environment:
      ED25519_PRIVATE_KEY_HEX: "${ANUBIS_ED25519_PRIVATE_KEY_HEX:?ANUBIS_ED25519_PRIVATE_KEY_HEX required}"
      BIND: ":8923"
      TARGET: "http://mesh-health-check:3090"
      COOKIE_DOMAIN: "ukmesh.com"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_EXPIRATION_TIME: "168h"
      POLICY_FNAME: "/data/botPolicy.yaml"
      SLOG_LEVEL: "INFO"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
    depends_on:
      mesh-health-check:
        condition: service_healthy
    networks:
      default:
        # Cloudflare Tunnel currently routes healthcheck.ukmesh.com to
        # http://anubis-mesh-health-check:8923. Keep this alias unless the
        # tunnel ingress config is changed at Cloudflare too.
        aliases:
          - anubis-mesh-health-check

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    command: tunnel run
    profiles: [tunnel]
    networks:
      - default
      - meshcore-beacon-ukmesh
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
      anubis-website-ukmesh:
        condition: service_started
      anubis-app-ukmesh:
        condition: service_started
      anubis-health-check:
        condition: service_started

  loki:
    <<: *internal-hosts
    image: grafana/loki:3.4
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./logging/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  promtail:
    <<: *internal-hosts
    image: grafana/promtail:3.4
    restart: always
    logging: *json-log-limits
    mem_limit: "256m"
    memswap_limit: "256m"
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./logging/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    <<: *internal-hosts
    image: grafana/grafana:11.5.0
    restart: always
    logging: *json-log-limits
    mem_limit: "512m"
    memswap_limit: "512m"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logging/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3010:3000"
    depends_on:
      - loki

networks:
  meshcore-beacon-ukmesh:
    external: true
    name: meshcore-beacon-ukmesh_default

volumes:
  timescaledb_data:
  mosquitto_data:
  mosquitto_log:
  redis_data:
  srtm_data:
  loki_data:
  grafana_data:
  mesh_health_check_data:
