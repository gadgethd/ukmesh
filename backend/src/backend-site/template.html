<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UKMesh Backend</title>
  <style nonce="{{CSP_NONCE}}">
    :root {
      color-scheme: dark;
      --ink: #edf5f0;
      --muted: #9daaa4;
      --line: #2f3a35;
      --surface: #151b18;
      --surface-2: #101511;
      --wash: #0b0f0d;
      --green: #43c789;
      --red: #ee6b6b;
      --yellow: #d6ab38;
      --teal: #4bb9b4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%, #16221c 0, #0b0f0d 34%, #0b0f0d 100%);
    }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; }
    .side {
      background: #101511;
      border-right: 1px solid var(--line);
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .nav { display: grid; gap: 8px; }
    .nav button {
      border: 1px solid var(--line);
      background: #121815;
      color: var(--ink);
      text-align: left;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }
    .nav button.active { border-color: var(--green); background: #193829; }
    .main { padding: 22px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 26px; line-height: 1.15; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .status { color: var(--muted); font-size: 13px; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .panel {
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .metric-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
    .metric-value { font-size: 25px; font-weight: 800; margin-top: 6px; }
    .metric-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .wide { grid-column: span 2; }
    .full { grid-column: 1 / -1; }
    .bars { display: grid; gap: 9px; }
    .bar-row { display: grid; grid-template-columns: 88px 1fr 72px; gap: 10px; align-items: center; font-size: 13px; }
    .bar-track { width: 100%; height: 12px; border: 0; border-radius: 8px; overflow: hidden; }
    .bar-track::-webkit-meter-bar { background: #222b26; border: 1px solid var(--line); border-radius: 8px; }
    .bar-track::-webkit-meter-optimum-value { background: var(--green); border-radius: 8px; }
    .bar-track.warn::-webkit-meter-optimum-value { background: var(--yellow); }
    .bar-track.bad::-webkit-meter-optimum-value { background: var(--red); }
    .bar-track::-moz-meter-bar { background: var(--green); border-radius: 8px; }
    .bar-track.warn::-moz-meter-bar { background: var(--yellow); }
    .bar-track.bad::-moz-meter-bar { background: var(--red); }
    .line-chart { width: 100%; height: 260px; display: block; }
    .line-chart text { fill: var(--muted); font-size: 11px; }
    .line-chart .axis { stroke: var(--line); stroke-width: 1; }
    .line-chart .grid-line { stroke: #24302a; stroke-width: 1; }
    .line-chart .gold-line { fill: none; stroke: var(--green); stroke-width: 3; }
    .line-chart .held-line { fill: none; stroke: var(--yellow); stroke-width: 2; }
    .line-chart .champ-line { fill: none; stroke: var(--teal); stroke-width: 3; stroke-dasharray: 6 5; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .legend span::before { content: ''; display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--green); }
    .legend .held::before { background: var(--yellow); }
    .legend .champ::before { background: var(--teal); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; }
    tr:hover td { background: #121a16; }
    th { color: var(--muted); font-size: 12px; font-weight: 700; }
    .pill { display: inline-flex; border-radius: 8px; padding: 3px 7px; background: #193829; color: #7be0aa; font-size: 12px; font-weight: 700; }
    .pill.bad { background: #3a1b1b; color: #ff9b9b; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .empty { color: var(--muted); padding: 18px 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .actions button, .actions input, .actions select {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101511;
      color: var(--ink);
      padding: 7px 9px;
      font: inherit;
    }
    .actions button { cursor: pointer; }
    .actions button:hover, .actions button:focus-visible { border-color: var(--green); }
    .actions button.danger:hover, .actions button.danger:focus-visible { border-color: var(--red); }
    .actions input { min-width: 190px; }
    .stack { display: grid; gap: 12px; }
    .scroll { overflow-x: auto; }
    @media (max-width: 1000px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: static; height: auto; }
      .grid, .metrics-grid, .chart-grid, .row { grid-template-columns: 1fr; }
      .wide { grid-column: span 1; }
      .status { text-align: left; }
      .top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">UKMesh Backend</div>
      <div class="sub">Local operator tools</div>
      <nav class="nav">
        <button data-page="overview">Overview</button>
        <button data-page="ml">ML Path Learner</button>
        <button data-page="operations">Job Operations</button>
        <button data-page="observers">Observer Registrations</button>
        <button id="logout" type="button">Log out</button>
      </nav>
    </aside>
    <main class="main">
      <div class="top">
        <div>
          <h1 id="title">Overview</h1>
          <div class="sub" id="subtitle">Backend tools home</div>
        </div>
        <div class="status">
          <div id="refreshState">Loading</div>
          <div id="runState"></div>
        </div>
      </div>
      <section id="app"></section>
    </main>
  </div>
  <script nonce="{{CSP_NONCE}}">
    const app = document.getElementById('app');
    const refreshState = document.getElementById('refreshState');
    const runState = document.getElementById('runState');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const navButtons = [...document.querySelectorAll('.nav button[data-page]')];
    const logoutButton = document.getElementById('logout');
    let state = null;
    let csrfToken = null;
    let refreshTimer = null;
    let currentPage = location.pathname.endsWith('/ml-path-learner')
      ? 'ml'
      : location.pathname.endsWith('/operations')
        ? 'operations'
        : location.pathname.endsWith('/observer-registrations')
          ? 'observers'
          : 'overview';

    if (currentPage === 'ml') {
      title.textContent = 'ML Path Learner';
      subtitle.textContent = 'Full packet path scoring from multibyte gold paths';
    }

    function num(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }
    function pct(value) {
      return (num(value) * 100).toFixed(1) + '%';
    }
    function int(value) {
      return Math.round(num(value)).toLocaleString();
    }
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[ch]));
    }
    function bar(value) {
      const v = Math.max(0, Math.min(1, num(value)));
      const cls = v >= 0.8 ? '' : v >= 0.65 ? ' warn' : ' bad';
      return '<meter class="bar-track' + cls + '" min="0" max="1" value="' + v.toFixed(4) + '"></meter>';
    }
    function metric(label, value, note) {
      return '<div class="panel"><div class="metric-label">' + esc(label) + '</div><div class="metric-value">' + value + '</div><div class="metric-note">' + esc(note || '') + '</div></div>';
    }
    function renderBars(rows, field, label) {
      if (!rows.length) return '<div class="empty">No variants yet</div>';
      return '<div class="bars">' + rows.map((row) => {
        const value = num(row[field]);
        return '<div class="bar-row"><div>v' + esc(row.variant_rank) + '</div>' + bar(value) + '<strong>' + pct(value) + '</strong></div>';
      }).join('') + '</div>';
    }
    function pointsFor(rows, field, width, height, pad) {
      if (!rows.length) return '';
      const minGen = Math.min(...rows.map((r) => num(r.generation)));
      const maxGen = Math.max(...rows.map((r) => num(r.generation)));
      const span = Math.max(1, maxGen - minGen);
      return rows.map((row) => {
        const x = pad + ((num(row.generation) - minGen) / span) * (width - pad * 2);
        const y = height - pad - (Math.max(0, Math.min(1, num(row[field]))) * (height - pad * 2));
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
    }
    function renderAccuracyHistory(rows, champions) {
      if (!rows.length) return '<div class="empty">No generation history yet</div>';
      const width = 900;
      const height = 260;
      const pad = 34;
      const goldPoints = pointsFor(rows, 'best_gold_replay_full_path_accuracy', width, height, pad);
      const heldPoints = pointsFor(rows, 'best_heldout_full_path_accuracy', width, height, pad);
      const champRows = (champions || []).map((champ) => ({
        generation: champ.generation,
        champion_full_path_accuracy: champ.champion_full_path_accuracy,
      }));
      const champPoints = pointsFor(champRows, 'champion_full_path_accuracy', width, height, pad);
      const minGen = Math.min(...rows.map((r) => num(r.generation)));
      const maxGen = Math.max(...rows.map((r) => num(r.generation)));
      const y80 = height - pad - (0.8 * (height - pad * 2));
      const y60 = height - pad - (0.6 * (height - pad * 2));
      return '<div class="legend"><span>Best gold replay</span><span class="held">Best held-back</span><span class="champ">Promoted champion</span></div>' +
        '<svg class="line-chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Accuracy by generation">' +
          '<line class="grid-line" x1="' + pad + '" y1="' + y80.toFixed(1) + '" x2="' + (width - pad) + '" y2="' + y80.toFixed(1) + '"></line>' +
          '<line class="grid-line" x1="' + pad + '" y1="' + y60.toFixed(1) + '" x2="' + (width - pad) + '" y2="' + y60.toFixed(1) + '"></line>' +
          '<line class="axis" x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (height - pad) + '"></line>' +
          '<line class="axis" x1="' + pad + '" y1="' + (height - pad) + '" x2="' + (width - pad) + '" y2="' + (height - pad) + '"></line>' +
          '<text x="4" y="' + (y80 + 4).toFixed(1) + '">80%</text><text x="4" y="' + (y60 + 4).toFixed(1) + '">60%</text>' +
          '<text x="' + pad + '" y="' + (height - 8) + '">gen ' + esc(minGen) + '</text>' +
          '<text x="' + (width - pad - 52) + '" y="' + (height - 8) + '">gen ' + esc(maxGen) + '</text>' +
          '<polyline class="gold-line" points="' + goldPoints + '"></polyline>' +
          '<polyline class="held-line" points="' + heldPoints + '"></polyline>' +
          (champPoints ? '<polyline class="champ-line" points="' + champPoints + '"></polyline>' : '') +
        '</svg>';
    }
    function renderMl() {
      title.textContent = 'ML Path Learner';
      subtitle.textContent = 'Full packet path scoring from multibyte gold paths';
      const active = state.activeModel || {};
      const championVariant = state.activeChampionVariant || {};
      const latest = state.latestRun || {};
      const variants = state.variantRuns || [];
      const scores = state.scoreSummary || [];
      const gold = state.goldSummary || [];
      const coverage = state.prefixCoverage || [];
      const worst = state.worstPackets || [];
      const accuracyHistory = state.accuracyHistory || [];
      const championHistory = state.championHistory || [];
      const latestBest = variants.reduce((best, row) => (
        num(row.complete_path_accuracy) > num(best?.complete_path_accuracy) ? row : best
      ), null);

      app.innerHTML =
        '<div class="metrics-grid">' +
          metric('Latest generation', esc(latest.generation ?? active.generation ?? 'none'), int(latest.variants_completed || variants.length) + '/' + int(latest.population_size || active.population_size || variants.length) + ' variants') +
          metric('Latest best replay', pct(latest.best_gold_replay_full_path_accuracy), latestBest ? 'gen ' + esc(latestBest.generation) + ' v' + esc(latestBest.variant_rank) : 'no variants') +
          metric('Active champion', 'gen ' + esc(active.generation ?? '-') + ' v' + esc(active.variant_rank ?? '-'), esc(active.version || 'none')) +
          metric('Champion replay', pct(active.complete_path_accuracy), int(active.evaluated_packets) + ' packets') +
          metric('Hop accuracy', pct(active.hop_accuracy), int(active.evaluated_hops) + ' hops') +
          metric('Resolver scores', int(scores.reduce((a, r) => a + num(r.scores), 0)), int(scores.reduce((a, r) => a + num(r.usable_scores), 0)) + ' at 0.80+') +
        '</div>' +
        '<div class="chart-grid">' +
          '<div class="panel wide"><h2>Gold Replay Full-Path Accuracy</h2>' + renderBars(variants, 'complete_path_accuracy') + '</div>' +
          '<div class="panel wide"><h2>Held-Back Full-Path Accuracy</h2>' + renderBars(variants, 'val_complete_path_accuracy') + '</div>' +
        '</div>' +
        '<div class="panel full"><h2>Accuracy History</h2>' + renderAccuracyHistory(accuracyHistory, championHistory) + '</div>' +
        '<div class="row">' +
          '<div class="panel"><h2>Score Rows</h2>' + renderScoreTable(scores) + '</div>' +
          '<div class="panel"><h2>Gold Corpus</h2>' + renderGoldTable(gold) + '</div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="panel"><h2>Prefix Coverage</h2>' + renderCoverageTable(coverage) + '</div>' +
          '<div class="panel"><h2>Active Champion Details</h2>' + renderPromoted(championVariant, active) + '</div>' +
        '</div>' +
        '<div class="panel full"><h2>Hard Packets</h2>' + renderWorstPackets(worst) + '</div>';
    }
    function renderScoreTable(rows) {
      if (!rows.length) return '<div class="empty">No scores yet</div>';
      return '<table><thead><tr><th>Network</th><th>Rows</th><th>0.80+</th><th>Max</th><th>Observations</th><th>Correct</th></tr></thead><tbody>' +
        rows.map((r) => '<tr><td>' + esc(r.network) + '</td><td>' + int(r.scores) + '</td><td>' + int(r.usable_scores) + '</td><td>' + pct(r.max_score) + '</td><td>' + int(r.observations) + '</td><td>' + int(r.correct) + '</td></tr>').join('') +
      '</tbody></table>';
    }
    function renderGoldTable(rows) {
      if (!rows.length) return '<div class="empty">No gold rows yet</div>';
      return '<table><thead><tr><th>Network</th><th>Packets</th><th>Hops</th><th>Nodes</th><th>Prefixes</th></tr></thead><tbody>' +
        rows.map((r) => '<tr><td>' + esc(r.network) + '</td><td>' + int(r.packets) + '</td><td>' + int(r.gold_hops) + '</td><td>' + int(r.unique_nodes) + '</td><td>' + int(r.prefixes) + '</td></tr>').join('') +
      '</tbody></table>';
    }
    function renderCoverageTable(rows) {
      if (!rows.length) return '<div class="empty">No coverage data yet</div>';
      return '<table><thead><tr><th>Network</th><th>Nodes</th><th>Node Prefixes</th><th>Gold Prefixes</th><th>Scored</th></tr></thead><tbody>' +
        rows.map((r) => '<tr><td>' + esc(r.network) + '</td><td>' + int(r.positioned_nodes) + '</td><td>' + int(r.node_prefixes) + '</td><td>' + int(r.gold_prefixes) + '</td><td>' + int(r.scored_prefixes) + '</td></tr>').join('') +
      '</tbody></table>';
    }
    function renderPromoted(row, active) {
      const merged = Object.assign({}, active || {}, row || {});
      return '<table><tbody>' +
        '<tr><th>Generation</th><td>' + esc(merged.generation ?? '-') + '</td></tr>' +
        '<tr><th>Variant</th><td>v' + esc(merged.variant_rank ?? '-') + '</td></tr>' +
        '<tr><th>Gold replay full paths</th><td>' + pct(merged.complete_path_accuracy) + '</td></tr>' +
        '<tr><th>Held-back full paths</th><td>' + (row?.val_complete_path_accuracy == null ? 'n/a' : pct(row.val_complete_path_accuracy)) + '</td></tr>' +
        '<tr><th>Gold replay hop accuracy</th><td>' + pct(merged.hop_accuracy) + '</td></tr>' +
        '<tr><th>Mean completion</th><td>' + pct(merged.mean_path_completion) + '</td></tr>' +
      '</tbody></table>';
    }
    function renderWorstPackets(rows) {
      if (!rows.length) return '<div class="empty">No packet audit rows yet</div>';
      return '<table><thead><tr><th>Network</th><th>Packet</th><th>Hops</th><th>Correct</th><th>Completion</th><th>Path</th></tr></thead><tbody>' +
        rows.map((r) => '<tr><td>' + esc(r.network) + '</td><td><code>' + esc(r.packet_hash) + '</code></td><td>' + int(r.expected_hops) + '</td><td>' + int(r.correct_hops) + '</td><td>' + pct(r.path_completion) + '</td><td>' + (r.complete_path ? '<span class="pill">complete</span>' : '<span class="pill bad">miss</span>') + '</td></tr>').join('') +
      '</tbody></table>';
    }
    function renderOverview() {
      title.textContent = 'Overview';
      subtitle.textContent = 'Backend tools home';
      const variants = state?.variantRuns || [];
      app.innerHTML =
        '<div class="grid">' +
          metric('Current tool', 'ML', 'Path learner audit is active') +
          metric('Variants this run', int(variants.length), 'Updates as each variant finishes') +
          metric('Training run', esc(state?.trainingRunId || 'none'), 'Latest run id') +
          metric('Updated', esc(new Date(state?.generatedAt || Date.now()).toLocaleTimeString()), 'Local browser time') +
        '</div>' +
        '<div class="panel full"><h2>Next slots</h2><div class="empty">Add backend tools here as needed.</div></div>';
    }
    function queueActions(queue) {
      const deadJobs = queue.dead?.jobs || [];
      const deadRows = deadJobs.length
        ? '<div class="scroll"><table><thead><tr><th>Job</th><th>Dead at</th><th>Attempts</th><th>Reason</th><th>Single-job action</th></tr></thead><tbody>' +
          deadJobs.map((job) => '<tr><td><code>' + esc(job.jobId) + '</code></td><td>' + esc(new Date(job.deadAt).toLocaleString()) + '</td><td>' + int(job.attempts) + '</td><td>' + esc(job.reason) + '</td><td><div class="actions">' +
            '<button type="button" data-queue-action="requeue" data-queue="' + esc(queue.name) + '" data-job="' + esc(job.jobId) + '">Requeue</button>' +
            '<button type="button" class="danger" data-queue-action="purge" data-queue="' + esc(queue.name) + '" data-job="' + esc(job.jobId) + '">Purge</button>' +
          '</div></td></tr>').join('') +
          '</tbody></table></div>'
        : '<div class="empty">No dead-letter jobs.</div>';
      return '<div class="panel full"><h2>' + esc(queue.name) + '</h2>' +
        '<div class="metrics-grid">' +
          metric('Active jobs', int(queue.active?.count), int(queue.active?.bytes) + ' bytes') +
          metric('Ready / leases', int(queue.ready) + ' / ' + int(queue.leases), int(queue.deferred) + ' deferred') +
          metric('Dead jobs', int(queue.dead?.count), int(queue.dead?.bytes) + ' bytes') +
          metric('Oldest age', int(queue.oldestAgeSeconds) + 's', queue.workerHealthy ? 'worker heartbeat present' : 'worker heartbeat missing') +
        '</div>' +
        deadRows +
        '<div class="actions"><label for="repair-' + esc(queue.name) + '">Type <code>REPAIR ' + esc(queue.name) + '</code></label>' +
          '<input id="repair-' + esc(queue.name) + '" data-repair-confirm="' + esc(queue.name) + '" autocomplete="off">' +
          '<button type="button" data-queue-action="repair" data-queue="' + esc(queue.name) + '" data-job="_queue">Repair counters</button></div>' +
      '</div>';
    }
    function renderOperations() {
      title.textContent = 'Job Operations';
      subtitle.textContent = 'Bounded queue recovery, leases, analysis runs, and model calibration';
      const queues = state.queues || [];
      const runs = state.analysisRuns || [];
      const planned = state.plannedCoverageJobs || [];
      const plannedNodes = state.plannedNodes || [];
      const models = state.modelCalibration || [];
      app.innerHTML = '<div class="stack">' +
        queues.map(queueActions).join('') +
        '<div class="panel full scroll"><h2>Analysis runs</h2>' +
          (runs.length ? '<table><thead><tr><th>Run</th><th>Workload</th><th>Status</th><th>Progress</th><th>Attempt</th><th>Lease owner</th><th>Lease expires</th><th>Terminal reason</th></tr></thead><tbody>' +
            runs.map((run) => '<tr><td><code>' + esc(run.run_id) + '</code></td><td>' + esc(run.workload) + ' / ' + esc(run.scope) + '</td><td>' + esc(run.status) + '</td><td>' + int(run.checkpoint) + ' / ' + int(run.total_items) + '</td><td>' + int(run.attempt) + '</td><td>' + esc(run.lease_owner || '-') + '</td><td>' + esc(run.lease_expires_at ? new Date(run.lease_expires_at).toLocaleString() : '-') + '</td><td>' + esc(run.terminal_reason || '-') + '</td></tr>').join('') +
            '</tbody></table>' : '<div class="empty">No analysis runs.</div>') +
        '</div>' +
        '<div class="panel full scroll"><h2>Planned coverage</h2>' +
          (planned.length ? '<table><thead><tr><th>Job</th><th>Status</th><th>Heartbeat</th><th>Expires</th><th>Error</th></tr></thead><tbody>' +
            planned.map((job) => '<tr><td><code>' + esc(job.job_id) + '</code></td><td>' + esc(job.status) + '</td><td>' + esc(job.heartbeat_at ? new Date(job.heartbeat_at).toLocaleString() : '-') + '</td><td>' + esc(new Date(job.expires_at).toLocaleString()) + '</td><td>' + esc(job.error || '-') + '</td></tr>').join('') +
            '</tbody></table>' : '<div class="empty">No planned coverage jobs.</div>') +
        '</div>' +
        '<div class="panel full scroll"><h2>Privacy-reviewed planned-node publishing</h2>' +
          (plannedNodes.length ? '<table><thead><tr><th>Private record</th><th>Private owner / notes</th><th>Public DTO</th><th>Review reason</th><th>Action</th></tr></thead><tbody>' +
            plannedNodes.map((node) => '<tr><td><strong>' + esc(node.name) + '</strong><br><code>' + esc(node.id) + '</code><br>' + esc(node.lat) + ', ' + esc(node.lon) + '</td>' +
              '<td><code>' + esc(node.owner_pubkey) + '</code><br>' + esc(node.notes || '-') + '</td>' +
              '<td><div class="actions"><label class="metric-label" for="pub-name-' + esc(node.id) + '">Name</label><input id="pub-name-' + esc(node.id) + '" data-pub-name="' + esc(node.id) + '" value="' + esc(node.public_name || node.name) + '" maxlength="100">' +
              '<label class="metric-label" for="pub-lat-' + esc(node.id) + '">Latitude</label><input id="pub-lat-' + esc(node.id) + '" data-pub-lat="' + esc(node.id) + '" value="' + esc(node.public_lat ?? node.lat) + '" inputmode="decimal">' +
              '<label class="metric-label" for="pub-lon-' + esc(node.id) + '">Longitude</label><input id="pub-lon-' + esc(node.id) + '" data-pub-lon="' + esc(node.id) + '" value="' + esc(node.public_lon ?? node.lon) + '" inputmode="decimal">' +
              '<label class="metric-label" for="pub-height-' + esc(node.id) + '">Height m</label><input id="pub-height-' + esc(node.id) + '" data-pub-height="' + esc(node.id) + '" value="' + esc(node.public_height_m ?? node.height_m ?? '') + '" inputmode="decimal">' +
              '<label class="metric-label" for="pub-region-' + esc(node.id) + '">Region</label><input id="pub-region-' + esc(node.id) + '" data-pub-region="' + esc(node.id) + '" value="' + esc(node.region || '') + '" maxlength="8">' +
              '<label class="metric-label" for="pub-expires-' + esc(node.id) + '">Expiry (ISO)</label><input id="pub-expires-' + esc(node.id) + '" data-pub-expires="' + esc(node.id) + '" value="' + esc(node.expires_at || new Date(Date.now() + 30 * 86400000).toISOString()) + '"></div></td>' +
              '<td><input aria-label="Publication review reason" data-pub-reason="' + esc(node.id) + '" maxlength="500"></td>' +
              '<td><div class="actions"><button type="button" data-publication-action="publish" data-node="' + esc(node.id) + '">Review &amp; publish</button>' +
              (node.published_at ? '<button type="button" class="danger" data-publication-action="unpublish" data-node="' + esc(node.id) + '">Unpublish</button>' : '') +
              '</div><div class="metric-note">' + (node.published_at ? 'Published ' + esc(new Date(node.published_at).toLocaleString()) : 'Private only') + '</div></td></tr>'
            ).join('') + '</tbody></table>' : '<div class="empty">No private planned-node records.</div>') +
        '</div>' +
        '<div class="panel full scroll"><h2>Model calibration by version and network</h2>' +
          (models.length ? '<table><thead><tr><th>Version</th><th>Network</th><th>Generation</th><th>Observed packets</th><th>Top-1</th><th>Complete path</th><th>Mean confidence</th><th>Threshold</th><th>Active</th></tr></thead><tbody>' +
            models.map((model) => '<tr><td><code>' + esc(model.version) + '</code></td><td>' + esc(model.network) + '</td><td>' + int(model.generation) + '</td><td>' + int(model.evaluated_packets) + '</td><td>' + pct(model.top1_accuracy) + '</td><td>' + pct(model.complete_path_accuracy) + '</td><td>' + pct(model.mean_pred_confidence) + '</td><td>' + pct(model.recommended_threshold) + '</td><td>' + (model.is_active ? 'yes' : 'no') + '</td></tr>').join('') +
            '</tbody></table>' : '<div class="empty">No model calibration rows.</div>') +
        '</div>' +
      '</div>';
    }
    function observerActionButtons(request) {
      if (request.status === 'pending') {
        return '<button type="button" data-observer-action="approve" data-request="' + esc(request.id) + '">Approve</button>' +
          '<button type="button" class="danger" data-observer-action="reject" data-request="' + esc(request.id) + '">Reject</button>';
      }
      if (request.status === 'approved') {
        return '<button type="button" data-observer-action="provision" data-request="' + esc(request.id) + '">Provision</button>';
      }
      if (request.notification_status === 'pending' || request.notification_status === 'failed') {
        return '<button type="button" data-observer-action="notification-sent" data-request="' + esc(request.id) + '">Mark notified</button>' +
          '<button type="button" class="danger" data-observer-action="notification-failed" data-request="' + esc(request.id) + '">Notification failed</button>';
      }
      return '';
    }
    function renderObservers() {
      title.textContent = 'Observer Registrations';
      subtitle.textContent = 'Operator-only PII review, duplicate detection, provisioning, and notification handoff';
      const registrations = state.registrations || [];
      app.innerHTML = '<div class="panel full"><div class="actions"><label for="observer-status">State</label>' +
        '<select id="observer-status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="expired">Expired</option><option value="provisioned">Provisioned</option><option value="all">All</option></select></div></div>' +
        '<div class="panel full scroll"><table><thead><tr><th>ID / state</th><th>Public key</th><th>Region / name</th><th>Contact (PII)</th><th>Duplicate</th><th>Decision</th><th>Action reason</th><th>Actions</th></tr></thead><tbody>' +
        (registrations.length ? registrations.map((request) =>
          '<tr><td>' + esc(request.id) + '<br><span class="pill' + (request.status === 'rejected' || request.status === 'expired' ? ' bad' : '') + '">' + esc(request.status) + '</span><br>' + esc(request.notification_status) + '</td>' +
          '<td><code>' + esc(request.public_key) + '</code></td><td>' + esc(request.iata) + '<br>' + esc(request.display_name || '-') + '</td><td>' + esc(request.contact) + '</td>' +
          '<td>' + esc(request.possible_duplicate_id || request.duplicate_of || '-') + '</td><td>' + esc(request.decision_reason || '-') + '</td>' +
          '<td><label class="metric-label" for="reason-' + esc(request.id) + '">Required reason</label><input id="reason-' + esc(request.id) + '" data-observer-reason="' + esc(request.id) + '" maxlength="500">' +
          '<label class="metric-label" for="duplicate-' + esc(request.id) + '">Duplicate ID (reject only)</label><input id="duplicate-' + esc(request.id) + '" data-observer-duplicate="' + esc(request.id) + '" value="' + esc(request.possible_duplicate_id || '') + '" inputmode="numeric"></td>' +
          '<td><div class="actions">' + observerActionButtons(request) + '</div></td></tr>'
        ).join('') : '<tr><td colspan="8" class="empty">No registrations in this state.</td></tr>') +
        '</tbody></table></div>';
      const select = document.getElementById('observer-status');
      select.value = state.status || 'pending';
      select.addEventListener('change', () => loadState(select.value));
    }
    function render() {
      if (!state) {
        app.innerHTML = '<div class="panel full"><div class="empty">Loading backend state</div></div>';
        return;
      }
      runState.textContent = state.trainingRunId ? 'run ' + state.trainingRunId : '';
      if (currentPage === 'overview') renderOverview();
      else if (currentPage === 'ml') renderMl();
      else if (currentPage === 'operations') renderOperations();
      else renderObservers();
    }
    async function loadState(observerStatus) {
      try {
        const endpoint = currentPage === 'operations'
          ? '/local-api/operations'
          : currentPage === 'observers'
            ? '/local-api/observer-registrations?status=' + encodeURIComponent(observerStatus || state?.status || 'pending')
            : '/local-api/ml-path-learner';
        const response = await fetch(endpoint, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        state = await response.json();
        refreshState.textContent = 'Updated ' + new Date().toLocaleTimeString();
        render();
      } catch (err) {
        refreshState.textContent = 'Update failed: ' + err.message;
      }
    }
    function mutationHeaders() {
      const headers = {
        'content-type': 'application/json',
        'idempotency-key': 'operator-ui:' + crypto.randomUUID()
      };
      if (csrfToken) headers['x-csrf-token'] = csrfToken;
      return headers;
    }
    async function mutate(url, body) {
      const response = await fetch(url, {
        method: 'POST',
        headers: mutationHeaders(),
        body: JSON.stringify(body)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'HTTP ' + response.status);
      await loadState();
    }
    async function loadSession() {
      const response = await fetch('/local-api/operator/session', { cache: 'no-store' });
      if (!response.ok) {
        location.reload();
        return;
      }
      const session = await response.json();
      csrfToken = session.csrfToken;
    }
    async function logout() {
      if (!csrfToken) return;
      const response = await fetch('/local-api/operator/logout', {
        method: 'POST',
        headers: { 'x-csrf-token': csrfToken },
      });
      if (response.ok) location.reload();
    }
    async function refreshVisible() {
      if (document.visibilityState === 'visible') await loadState();
      refreshTimer = setTimeout(refreshVisible, 15000);
    }
    navButtons.forEach((button) => {
      button.addEventListener('click', () => {
        currentPage = button.dataset.page;
        navButtons.forEach((b) => b.classList.toggle('active', b === button));
        const path = currentPage === 'overview' ? '/' : currentPage === 'ml' ? '/ml-path-learner' : currentPage === 'operations' ? '/operations' : '/observer-registrations';
        history.replaceState(null, '', path);
        state = null;
        render();
        loadState();
      });
    });
    app.addEventListener('click', async (event) => {
      const queueButton = event.target.closest('[data-queue-action]');
      const observerButton = event.target.closest('[data-observer-action]');
      const publicationButton = event.target.closest('[data-publication-action]');
      try {
        if (queueButton) {
          const action = queueButton.dataset.queueAction;
          const queue = queueButton.dataset.queue;
          const job = queueButton.dataset.job;
          const confirmation = action === 'purge'
            ? 'PURGE ' + job
            : action === 'repair'
              ? document.querySelector('[data-repair-confirm="' + CSS.escape(queue) + '"]').value
              : undefined;
          await mutate('/local-api/jobs/' + encodeURIComponent(queue) + '/' + encodeURIComponent(job) + '/' + encodeURIComponent(action), { confirmation });
        } else if (observerButton) {
          const action = observerButton.dataset.observerAction;
          const id = observerButton.dataset.request;
          const reason = document.querySelector('[data-observer-reason="' + CSS.escape(id) + '"]').value;
          const duplicateOf = document.querySelector('[data-observer-duplicate="' + CSS.escape(id) + '"]').value || undefined;
          await mutate('/local-api/observer-registrations/' + encodeURIComponent(id) + '/action', { action, reason, duplicateOf });
        } else if (publicationButton) {
          const action = publicationButton.dataset.publicationAction;
          const id = publicationButton.dataset.node;
          const read = (field) => document.querySelector('[data-pub-' + field + '="' + CSS.escape(id) + '"]').value;
          await mutate('/local-api/planned-nodes/' + encodeURIComponent(id) + '/publication', {
            action,
            reason: read('reason'),
            ...(action === 'publish' ? {
              publicName: read('name'),
              publicLat: read('lat'),
              publicLon: read('lon'),
              publicHeightM: read('height'),
              region: read('region'),
              expiresAt: read('expires')
            } : {})
          });
        }
      } catch (error) {
        refreshState.textContent = 'Action failed: ' + error.message;
      }
    });
    navButtons.forEach((button) => button.classList.toggle('active', button.dataset.page === currentPage));
    logoutButton.addEventListener('click', logout);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        clearTimeout(refreshTimer);
        refreshVisible();
      }
    });
    loadSession().then(refreshVisible);
  </script>
</body>
</html>
